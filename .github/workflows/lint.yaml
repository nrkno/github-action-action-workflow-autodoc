on:
  pull_request:

# The called workflow (v5.1.5) declares contents: write and pull-requests: read
# on its release job. A caller must grant at least that, even though the job is
# skipped here (release-enabled: false); otherwise the run fails at startup.
# The commitlint job inside it only requests contents: read.
permissions:
  contents: write
  pull-requests: read

jobs:
  commitlint:
    uses: nrkno/github-workflow-semantic-release/.github/workflows/workflow.yaml@6a8585e39eabcb53cdbdebfcc76eb9672199089e # v5.1.5
    with:
      runs-on: ubuntu-latest
      release-enabled: false
