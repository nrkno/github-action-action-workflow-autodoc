on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# The default token is read-only; the job below opts in to what it needs.
permissions: {}

jobs:
  autodoc:
    name: Auto-generated action documentation
    permissions:
      contents: write
    # Off until the bump below. The called workflow still runs action v2.2.0,
    # which renders the old README templates, so running it here would commit a
    # revert of the regenerated README. Leave AUTODOC_SELFTEST off until the bump.
    # TODO(bump): remove the opt-in condition only; keep skipping draft PRs.
    if: vars.AUTODOC_SELFTEST == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    # TODO(bump): move to the workflow release that carries the credential split
    # and plain `runs-on` support. The pinned v1.1.4 still needs the JSON-quoted form below.
    uses: nrkno/github-workflow-action-workflow-autodoc/.github/workflows/workflow.yaml@84a54022b61e892fcc09d945795771d2d3822ad7 # v1.1.4
    with:
      runs-on: '"ubuntu-latest"'
      workflow_file: action.yaml
      doc_file: README.md
      start_token: "<!-- start -->"
      end_token: "<!-- end -->"
      table: "true"
