on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autodoc:
    name: Auto-generated workflow documentation
    uses: nrkno/github-workflow-action-workflow-autodoc/.github/workflows/workflow.yaml@a212cd3cb3384fb598821ff127ef12c641644475 # v1.1.0
    with:
      runs-on: '["nrk-azure-intern","linux"]'
      workflow_file: .github/workflows/workflow.yaml
      doc_file: README.md
      start_token: "<!-- start -->"
      end_token: "<!-- end -->"
      table: "true"
      github_output: "true"
