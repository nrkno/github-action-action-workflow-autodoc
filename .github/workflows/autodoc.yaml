on:
  pull_request:
  workflow_dispatch:

jobs:
  autodoc:
    name: Auto-generate Action Workflow Documentation
    runs-on: ["nrk-azure-intern", "linux"]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ env.BRANCH_NAME }}

      - name: Auto-generate Action Workflow Documentation
        uses: nrkno/github-action-action-workflow-autodoc@v1
        with:
          workflow_file: action.yaml
          doc_file: README.md
