name: Version Check

on:
  pull_request:
    branches:
      - main

env:
  MANIFEST_PATH: action.yaml

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  check-version:
    name: Version Check
    runs-on: ubuntu-latest

    if: ${{ github.actor != 'dependabot[bot]' }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-tags: true

      - name: Check Version
        id: check-version
        uses: issue-ops/semver@e58d2f490332e0310a78e9a0e935d8d6f898e9e3 # v3
        with:
          check-only: true
          manifest-path: ${{ env.MANIFEST_PATH }}
