on:
  push:
    paths-ignore:
      - "**/.github/**"
      - "**README.md"
    branches:
      - main

# Never run two releases at once; queue instead of cancelling a running one.
concurrency:
  group: release
  cancel-in-progress: false

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# The action image is built by the consumer's runner from the Dockerfile at the
# action ref (see action.yaml). A release therefore only creates tags and a
# GitHub release; there is no image to build or publish.
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "lts/*"

      # package-lock.json pins the whole release toolchain.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
